<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Pomodoro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="big-container">
    <div class="container">
      <div class="timer">
        <div class="timer-container drop-shadow">
          <p id="title">Pokémon Pomodoro</p>
          <p id="notifier">It's time to focus!</p>
          <p id="timer">25:00</p>
        </div>
        <div class="btns drop-shadow">
          <button id="start">Start</button>
          <button id="stop">Stop</button>
          <button id="reset">Reset</button>
        </div>
        <img src="" alt="" id="pokemon">
        <div class="choose">
          <label for="pokemone">Choose a Pokémon:</label>
          <select name="pokemone" id="">
            <option value="sylveon">
              <img src="images/sylveon.png" alt="" width=40">
              <p>Sylveon</p>
            </option>
            <option value="mimikyu">
              <img src="images/mimikyu.png" width="40">
              <p>Mimikyu</p>
            </option>
            <option value="mabosstiff">
              <img src="images/mabosstiff.png" alt="" width="40">
              <p>Mabosstiff</p>
            </option>
            <option value="minior">
              <img src="images/minior.png" alt="" width="40">
              <p>Minior</p>
            </option>
          </select>

        </div>
      </div>
      <div class="todos">
        <p class="drop-shadow">To-dos</p>
        <div class="submit drop-shadow">
          <form action="javascript:void(0);">
            <input type="text" id="todoInput" placeholder="Add a item">
            <button type="submit" id="todoSubmit">+</button>
          </form>
        </div>
        <ul class="drop-shadow" id="todoList">
          <li>catch a pokemon</li>
          <li class="checked">make a sandwich</li>
        </ul>
      </div>
      <div class="settings drop-shadow">
        <h2>Settings</h2>
        <div class="slider-container">
          <label for="focus">Set focus time:</label>
          <input type="number" id="focus-input">
        </div>
        <div class="slider-container">
          <label for="break">Set break time:</label>
          <input type="number" id="break-input">
        </div>
        <div class="ambience-container">
          <p>Set ambience:</p>
          <div class="ambience-buttons">
            <button>rain</button>
            <button>fireplace</button>
            <button>typing</button>
          </div>
          <div class="volume">
            <input type="range" min="0" max="100" value="25" class="slider" id="volumeSlider" name="volume">
          </div>
        </div>
      </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
